site_name: Forge
site_description: "Universal Agent Harness — Drop your agents. Watch them evolve, remember and win."
site_url: https://forge-ai.dev
repo_url: https://github.com/forge-ai/forge
repo_name: forge-ai/forge
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: deep orange
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  logo: assets/forge-icon.svg
  favicon: assets/forge-icon.svg

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables

nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: quickstart.md
  - Concepts:
      - Architecture: architecture.md
      - Self-Evolution: self-evolution.md
      - Living Memory: memory.md
  - Adapters:
      - LangGraph: adapters/langgraph.md
      - CrewAI: adapters/crewai.md
      - AutoGen: adapters/autogen.md
  - API Reference: api-reference/index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/forge-ai/forge
    - icon: fontawesome/brands/discord
      link: https://discord.gg/forge-ai
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/forgeharness
