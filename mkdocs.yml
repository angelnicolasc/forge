site_name: Forge
site_description: "Check saved agent results in CI, govern tool calls and evaluate evidence before promoting a revision."
repo_url: https://github.com/angelnicolasc/forge
repo_name: angelnicolasc/forge
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: deep orange
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables

nav:
  - Home: index.md
  - Forge Check:
      - Check saved results in CI: check.md
      - Run a governed support binding: governed.md
      - Compose governed reads with Code Mode: code-mode.md
      - Check conditional inventory evidence: conditional-evidence.md
      - Rollout and recovery: operations.md
  - Design decisions:
      - Overview: decisions/index.md
      - Tool contracts in the revision: decisions/0001-binding-contracts.md
      - Code Mode for governed reads: decisions/0002-code-mode.md
      - Evidence for conditional reads: decisions/0003-conditional-evidence.md
      - Canary traffic at the dispatch boundary: decisions/0004-rollout-traffic.md
      - Capacity under sustained load: decisions/0005-rollout-capacity.md
  - Earlier Forge harness:
      - Harness quickstart: quickstart.md
      - Harness architecture: architecture.md
      - Harness feature map: feature-map.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/angelnicolasc/forge
