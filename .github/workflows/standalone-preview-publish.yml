name: Publish standalone preview to TestPyPI

on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful standalone candidate workflow run ID
        type: string
        required: true
      candidate_attempt:
        description: Approved attempt number within that run
        type: string
        required: true
      candidate_sha:
        description: Exact source SHA approved for this preview
        type: string
        required: true
      vast_id:
        description: Approved Vast instance ID
        type: string
        required: true
      bundle_sha256:
        description: Approved evidence bundle SHA-256
        type: string
        required: true
      wheel_sha256:
        description: Approved wheel SHA-256
        type: string
        required: true

permissions: {}

concurrency:
  group: standalone-preview-testpypi
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'angelnicolasc/forge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: standalone-preview-testpypi
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      CANDIDATE_ATTEMPT: ${{ inputs.candidate_attempt }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      VAST_ID: ${{ inputs.vast_id }}
      BUNDLE_SHA: ${{ inputs.bundle_sha256 }}
      WHEEL_SHA: ${{ inputs.wheel_sha256 }}
      BASELINE_SHA: ${{ vars.STANDALONE_BASELINE_SHA256 }}
    steps:
      - name: Check out publisher from protected main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Authenticate the candidate workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/standalone-preview-candidate.yml" --jq .id)"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN}" | jq -e \
            --argjson workflow "$workflow_id" --argjson attempt "$CANDIDATE_ATTEMPT" \
            --arg repository "$GITHUB_REPOSITORY" '
              .workflow_id == $workflow and .event == "workflow_dispatch" and
              .status == "completed" and .conclusion == "success" and
              .head_branch == "main" and .run_attempt == $attempt and
              .head_repository.full_name == $repository
            ' > /dev/null

      - name: Download the approved immutable candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: standalone-preview-${{ inputs.candidate_attempt }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/approved-preview

      - name: Stage exactly the approved wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            fetch --no-tags --depth=1 origin "$CANDIDATE_SHA"
          [[ "$(git rev-parse FETCH_HEAD)" == "$CANDIDATE_SHA" ]]
          python3 .github/standalone/preview_artifact.py verify --repo . --require-preview \
            --bundle "$RUNNER_TEMP/approved-preview/standalone-preview.zip" \
            --bundle-sha256 "$BUNDLE_SHA" --commit "$CANDIDATE_SHA" --wheel-sha256 "$WHEEL_SHA" \
            --baseline-sha256 "$BASELINE_SHA" --vast-id "$VAST_ID" --stage .standalone-publish \
            > "$RUNNER_TEMP/preview-approval.json"

      - name: Probe the approved version on TestPyPI
        id: probe
        run: |
          set -euo pipefail
          RELEASE_VERSION="$(jq -er .version "$RUNNER_TEMP/preview-approval.json")"
          python3 .github/standalone/preview_artifact.py verify-index --index testpypi --probe \
            --version "$RELEASE_VERSION" --wheel-sha256 "$WHEEL_SHA" > "$RUNNER_TEMP/index-probe.json"
          state="$(jq -er '.state | select(. == "absent" or . == "verified")' "$RUNNER_TEMP/index-probe.json")"
          printf 'state=%s\n' "$state" >> "$GITHUB_OUTPUT"

      - name: Publish the approved wheel to TestPyPI
        id: upload
        if: steps.probe.outputs.state == 'absent'
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: .standalone-publish/
          skip-existing: false

      - name: Read back the exact index bytes and record the upload outcome
        id: readback
        if: ${{ !cancelled() && steps.probe.outcome == 'success' }}
        env:
          INDEX_BEFORE: ${{ steps.probe.outputs.state }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="$(jq -er .version "$RUNNER_TEMP/preview-approval.json")"
          case "$INDEX_BEFORE:$UPLOAD_OUTCOME" in
            absent:success) publication_state=trusted-upload-verified ;;
            absent:failure|verified:skipped) publication_state=recovered-index-verified ;;
            *) echo "Index probe and upload outcomes disagree" >&2; exit 1 ;;
          esac
          if python3 .github/standalone/preview_artifact.py verify-index --index testpypi \
            --version "$RELEASE_VERSION" --wheel-sha256 "$WHEEL_SHA" > "$RUNNER_TEMP/index.json" &&
            bytes="$(jq -er '.bytes | select(type == "number" and . > 0)' "$RUNNER_TEMP/index.json")"; then
            :
          else
            bytes=null
            publication_state=index-unverified
          fi
          jq -n --arg index "testpypi" --arg version "$RELEASE_VERSION" --arg digest "$WHEEL_SHA" \
            --arg commit "$CANDIDATE_SHA" --arg bundle "$BUNDLE_SHA" --arg vast "$VAST_ID" \
            --arg index_before "$INDEX_BEFORE" --arg upload_outcome "$UPLOAD_OUTCOME" \
            --arg publication_state "$publication_state" --argjson bytes "$bytes" \
            --argjson candidate_run "$CANDIDATE_RUN" --argjson candidate_attempt "$CANDIDATE_ATTEMPT" \
            --argjson run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            '{schema: 2, index: $index, version: $version, wheel_sha256: $digest,
              commit: $commit, bundle_sha256: $bundle, vast_lab_id: $vast, bytes: $bytes,
              workflow_run: $run, workflow_attempt: $attempt, index_before: $index_before,
              upload_outcome: $upload_outcome, publication_state: $publication_state,
              candidate_run: $candidate_run, candidate_attempt: $candidate_attempt}' \
            > "$RUNNER_TEMP/published-wheel.json"
          [[ "$publication_state" != index-unverified ]]

      - name: Preserve publication evidence
        if: ${{ !cancelled() && (steps.readback.outcome == 'success' || steps.readback.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: standalone-preview-publication-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/published-wheel.json
            ${{ runner.temp }}/index-probe.json
            ${{ runner.temp }}/preview-approval.json
          if-no-files-found: error
          retention-days: 30
