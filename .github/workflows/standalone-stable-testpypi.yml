name: Publish standalone stable to TestPyPI

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact Git commit of the stable build
        type: string
        required: true
      vast_id:
        description: Vast ID from the approved evidence
        type: string
        required: true
      bundle_sha256:
        description: SHA-256 of the sealed Vast evidence
        type: string
        required: true
      wheel_sha256:
        description: SHA-256 of the approved wheel
        type: string
        required: true

permissions: {}

concurrency:
  group: standalone-stable-testpypi
  cancel-in-progress: false

env:
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  VAST_ID: ${{ inputs.vast_id }}
  BUNDLE_SHA: ${{ inputs.bundle_sha256 }}
  WHEEL_SHA: ${{ inputs.wheel_sha256 }}

jobs:
  verify:
    if: github.repository == 'angelnicolasc/forge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: standalone-stable-intake
    permissions:
      actions: read
      contents: read
      statuses: read
    outputs:
      version: ${{ steps.approval.outputs.version }}
    env:
      BASELINE_SHA: ${{ vars.STANDALONE_BASELINE_SHA256 }}
      TRUST_BASE: ${{ vars.STANDALONE_TRUST_BASE }}
      SIGNER_LINE: ${{ vars.STANDALONE_ALLOWED_SIGNER }}
      SIGNER_PRINCIPAL: ${{ vars.STANDALONE_SIGNER_PRINCIPAL }}
      SIGNER_FINGERPRINT: ${{ vars.STANDALONE_SIGNER_FINGERPRINT }}
    steps:
      - name: Check out tools from protected main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source identity and signed review
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          [[ "$MAIN_PROTECTED" == true ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ && "$TRUST_BASE" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$CANDIDATE_SHA" "$GITHUB_SHA"
          printf '%s\n' "$SIGNER_LINE" > "$RUNNER_TEMP/standalone-allowed-signers"
          python3 .github/standalone/verify_signatures.py \
            --base "$TRUST_BASE" --head "$CANDIDATE_SHA" \
            --allowed-signers "$RUNNER_TEMP/standalone-allowed-signers" \
            --principal "$SIGNER_PRINCIPAL" --fingerprint "$SIGNER_FINGERPRINT" \
            > "$RUNNER_TEMP/signatures.json"

          status="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE_SHA}/statuses?per_page=100" | \
            jq -ce 'first(.[][] | select(.context == "forge/standalone-signed-series"))')"
          prefix="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/"
          run_url="$(jq -er --arg prefix "$prefix" \
            'select(.state == "success" and .creator.login == "github-actions[bot]") |
             (.target_url // "") | select(startswith($prefix))' <<< "$status")"
          run_id="${run_url#"$prefix"}"
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/standalone-signatures.yml" --jq .id)"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" | jq -e \
            --argjson run "$run_id" --argjson workflow "$workflow_id" \
            --arg commit "$CANDIDATE_SHA" --arg repository "$GITHUB_REPOSITORY" '
              .id == $run and .workflow_id == $workflow and .event == "pull_request_target" and
              .head_sha == $commit and .repository.full_name == $repository and
              .head_repository.full_name == $repository and
              .status == "completed" and .conclusion == "success"
            ' > /dev/null

      - name: Retrieve the approved Vast evidence
        env:
          STANDALONE_VAST_BUNDLE_URL: ${{ secrets.STANDALONE_VAST_BUNDLE_URL }}
          BUNDLE_HOST: ${{ vars.STANDALONE_VAST_BUNDLE_HOST }}
        run: |
          set -euo pipefail
          python3 .github/standalone/preview_artifact.py fetch --host "$BUNDLE_HOST" \
            --bundle-sha256 "$BUNDLE_SHA" --output "$RUNNER_TEMP/standalone-stable.zip"

      - name: Stage the single stable wheel
        id: approval
        run: |
          set -euo pipefail
          python3 .github/standalone/preview_artifact.py verify --repo . --require-stable \
            --bundle "$RUNNER_TEMP/standalone-stable.zip" --bundle-sha256 "$BUNDLE_SHA" \
            --commit "$CANDIDATE_SHA" --wheel-sha256 "$WHEEL_SHA" \
            --baseline-sha256 "$BASELINE_SHA" --vast-id "$VAST_ID" \
            --stage "$RUNNER_TEMP/approved-wheel" > "$RUNNER_TEMP/approval.json"
          version="$(jq -er .version "$RUNNER_TEMP/approval.json")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Preserve the reviewed evidence for production
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: standalone-stable-evidence-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/standalone-stable.zip
            ${{ runner.temp }}/signatures.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Pass only the wheel to the publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: standalone-stable-wheel-${{ github.run_attempt }}
          path: ${{ runner.temp }}/approved-wheel/*.whl
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: standalone-stable-testpypi
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Check out index verifier from protected main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Retrieve the verified wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: standalone-stable-wheel-${{ github.run_attempt }}
          path: .standalone-publish

      - name: Check the staged bytes
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          shopt -s nullglob dotglob
          files=(.standalone-publish/*)
          wheel=".standalone-publish/forge_os_check-${RELEASE_VERSION}-py3-none-any.whl"
          [[ ${#files[@]} -eq 1 && "${files[0]-}" == "$wheel" && -f "$wheel" && ! -L "$wheel" ]]
          printf '%s  %s\n' "$WHEEL_SHA" "$wheel" | sha256sum --check --strict

      - name: Publish the approved wheel to TestPyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: .standalone-publish/
          skip-existing: false

      - name: Verify the published bytes and record the exact attempt
        run: |
          set -euo pipefail
          python3 .github/standalone/preview_artifact.py verify-index --index testpypi \
            --version "$RELEASE_VERSION" --wheel-sha256 "$WHEEL_SHA" > "$RUNNER_TEMP/index.json"
          jq --arg commit "$CANDIDATE_SHA" --arg bundle "$BUNDLE_SHA" --arg vast "$VAST_ID" \
            --argjson run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            '{schema: 1, index: "testpypi", commit: $commit, bundle_sha256: $bundle,
              vast_lab_id: $vast, workflow_run: $run, workflow_attempt: $attempt,
              version, wheel_sha256, bytes}' \
            "$RUNNER_TEMP/index.json" > "$RUNNER_TEMP/testpypi-receipt.json"

      - name: Preserve the TestPyPI receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: standalone-stable-testpypi-${{ github.run_attempt }}
          path: ${{ runner.temp }}/testpypi-receipt.json
          if-no-files-found: error
          retention-days: 30
