name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dev dependencies
        run: uv sync --all-packages --all-extras

      - name: Ruff lint
        run: uv run ruff check packages/ --output-format=github

      - name: Ruff format check
        run: uv run ruff format packages/ --check

      - name: Mypy type check
        run: uv run mypy packages/forge-core/src packages/forge-memory/src packages/forge-adapters/src packages/forge-observe/src packages/forge-cli/src

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install workspace
        run: uv sync --all-packages --all-extras

      - name: Run tests
        run: uv run pytest --cov=packages --cov-report=xml --cov-report=term-missing --cov-fail-under=75

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install workspace (for mypy hook)
        run: uv sync --all-packages --all-extras

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  build:
    name: Build packages
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Build all packages
        run: |
          for pkg in packages/*/; do
            echo "Building $pkg..."
            uv build --package $(basename $pkg) --out-dir dist/
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  smoke-install:
    name: Smoke install forge-os
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install forge-os in a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          # Install from the wheels we just built; --find-links resolves
          # the forge-* sub-packages (forge-core, forge-cli, etc.) from the
          # local dist/ dir; external deps (pydantic, typer, …) come from PyPI.
          /tmp/smoke/bin/pip install --find-links dist/ dist/forge_os-*.whl

      - name: Verify CLI + import
        run: |
          /tmp/smoke/bin/forge --help
          /tmp/smoke/bin/python -c "import forge_os; print('forge_os', forge_os.__version__)"
          /tmp/smoke/bin/python -c "from forge_core.harness import MetaOrchestrator; MetaOrchestrator()"

  examples-smoke:
    name: Examples smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v3

      - name: Install workspace
        run: uv sync --all-packages --all-extras

      - name: Run crewai_content example
        run: uv run python examples/crewai_content/flow.py '{"topic":"AI harnesses"}'

      - name: Run autogen_coding example
        run: uv run python examples/autogen_coding/flow.py '{"task":"sum a list"}'
