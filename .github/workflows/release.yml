name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual publish (e.g. publish missing packages)"
        required: false
        default: "manual publish"

permissions:
  contents: write

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Build all packages
        run: |
          ROOT=$(pwd)
          mkdir -p "$ROOT/dist"
          for pkg in packages/*/; do
            name=$(grep -m1 '^name = ' "${pkg}pyproject.toml" | sed 's/name = "\(.*\)"/\1/')
            echo "Building $name..."
            uv build --package "$name" --out-dir "$ROOT/dist"
          done

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./dist
          format: spdx-json
          output-file: forge-os.spdx.json

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            forge-os.spdx.json
