name: Promote standalone stable to PyPI

on:
  workflow_dispatch:
    inputs:
      testpypi_run:
        description: Successful stable TestPyPI workflow run ID
        type: string
        required: true
      testpypi_attempt:
        description: Approved attempt of the TestPyPI run
        type: string
        required: true
      candidate_sha:
        description: Exact Git commit of the stable build
        type: string
        required: true
      vast_id:
        description: Vast ID from the approved evidence
        type: string
        required: true
      bundle_sha256:
        description: SHA-256 of the sealed Vast evidence
        type: string
        required: true
      wheel_sha256:
        description: SHA-256 of the approved wheel
        type: string
        required: true

permissions: {}

concurrency:
  group: standalone-stable-pypi
  cancel-in-progress: false

env:
  TESTPYPI_RUN: ${{ inputs.testpypi_run }}
  TESTPYPI_ATTEMPT: ${{ inputs.testpypi_attempt }}
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  VAST_ID: ${{ inputs.vast_id }}
  BUNDLE_SHA: ${{ inputs.bundle_sha256 }}
  WHEEL_SHA: ${{ inputs.wheel_sha256 }}

jobs:
  verify:
    if: github.repository == 'angelnicolasc/forge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: standalone-stable-promotion
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.approval.outputs.version }}
    env:
      BASELINE_SHA: ${{ vars.STANDALONE_BASELINE_SHA256 }}
      TRUST_BASE: ${{ vars.STANDALONE_TRUST_BASE }}
      SIGNER_LINE: ${{ vars.STANDALONE_ALLOWED_SIGNER }}
      SIGNER_PRINCIPAL: ${{ vars.STANDALONE_SIGNER_PRINCIPAL }}
      SIGNER_FINGERPRINT: ${{ vars.STANDALONE_SIGNER_FINGERPRINT }}
    steps:
      - name: Check out tools from protected main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate the exact stable TestPyPI attempt
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          [[ "$MAIN_PROTECTED" == true ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TESTPYPI_RUN" =~ ^[1-9][0-9]*$ && "$TESTPYPI_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          git merge-base --is-ancestor "$CANDIDATE_SHA" "$GITHUB_SHA"
          workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/standalone-stable-testpypi.yml" --jq .id)"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TESTPYPI_RUN}/attempts/${TESTPYPI_ATTEMPT}" | jq -e \
            --argjson run "$TESTPYPI_RUN" --argjson attempt "$TESTPYPI_ATTEMPT" \
            --argjson workflow "$workflow_id" --arg repository "$GITHUB_REPOSITORY" '
              .id == $run and .run_attempt == $attempt and .workflow_id == $workflow and
              .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success" and
              .head_branch == "main" and .head_repository.full_name == $repository
            ' > /dev/null

      - name: Verify the signed source against the production trust anchor
        run: |
          set -euo pipefail
          [[ "$TRUST_BASE" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$TRUST_BASE" "$GITHUB_SHA"
          printf '%s\n' "$SIGNER_LINE" > "$RUNNER_TEMP/stable-allowed-signers"
          python3 .github/standalone/verify_signatures.py \
            --base "$TRUST_BASE" --head "$CANDIDATE_SHA" \
            --allowed-signers "$RUNNER_TEMP/stable-allowed-signers" \
            --principal "$SIGNER_PRINCIPAL" --fingerprint "$SIGNER_FINGERPRINT"

      - name: Download the sealed Vast evidence from that attempt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: standalone-stable-evidence-${{ inputs.testpypi_attempt }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.testpypi_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/approved-evidence

      - name: Download the TestPyPI receipt from that attempt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: standalone-stable-testpypi-${{ inputs.testpypi_attempt }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.testpypi_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/approved-testpypi

      - name: Match the sealed wheel, publication receipt and live TestPyPI bytes
        id: approval
        run: |
          set -euo pipefail
          python3 .github/standalone/preview_artifact.py verify --repo . --require-stable \
            --bundle "$RUNNER_TEMP/approved-evidence/standalone-stable.zip" --bundle-sha256 "$BUNDLE_SHA" \
            --commit "$CANDIDATE_SHA" --wheel-sha256 "$WHEEL_SHA" \
            --baseline-sha256 "$BASELINE_SHA" --vast-id "$VAST_ID" \
            --stage "$RUNNER_TEMP/approved-wheel" > "$RUNNER_TEMP/approval.json"
          version="$(jq -er .version "$RUNNER_TEMP/approval.json")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          receipt="$RUNNER_TEMP/approved-testpypi/testpypi-receipt.json"
          jq -e --arg commit "$CANDIDATE_SHA" --arg bundle "$BUNDLE_SHA" --arg vast "$VAST_ID" \
            --arg version "$version" --arg digest "$WHEEL_SHA" \
            --argjson run "$TESTPYPI_RUN" --argjson attempt "$TESTPYPI_ATTEMPT" '
              .schema == 1 and .index == "testpypi" and .commit == $commit and
              .bundle_sha256 == $bundle and .vast_lab_id == $vast and .version == $version and
              .wheel_sha256 == $digest and .workflow_run == $run and .workflow_attempt == $attempt
            ' "$receipt" > /dev/null
          python3 .github/standalone/preview_artifact.py verify-index --index testpypi \
            --version "$version" --wheel-sha256 "$WHEEL_SHA" > "$RUNNER_TEMP/index.json"
          diff -u <(jq -S '{version, wheel_sha256, bytes}' "$receipt") \
            <(jq -S '{version, wheel_sha256, bytes}' "$RUNNER_TEMP/index.json")
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Pass only the wheel to the publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: standalone-stable-production-wheel-${{ github.run_attempt }}
          path: ${{ runner.temp }}/approved-wheel/*.whl
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: standalone-stable-pypi
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Check out index verifier from protected main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Retrieve the verified wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: standalone-stable-production-wheel-${{ github.run_attempt }}
          path: .standalone-publish

      - name: Check the staged bytes
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          shopt -s nullglob dotglob
          files=(.standalone-publish/*)
          wheel=".standalone-publish/forge_os_check-${RELEASE_VERSION}-py3-none-any.whl"
          [[ ${#files[@]} -eq 1 && "${files[0]-}" == "$wheel" && -f "$wheel" && ! -L "$wheel" ]]
          printf '%s  %s\n' "$WHEEL_SHA" "$wheel" | sha256sum --check --strict

      - name: Publish the approved wheel to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          repository-url: https://upload.pypi.org/legacy/
          packages-dir: .standalone-publish/
          skip-existing: false

      - name: Verify the published bytes and record the promotion
        run: |
          set -euo pipefail
          python3 .github/standalone/preview_artifact.py verify-index --index pypi \
            --version "$RELEASE_VERSION" --wheel-sha256 "$WHEEL_SHA" > "$RUNNER_TEMP/index.json"
          jq --arg commit "$CANDIDATE_SHA" --arg bundle "$BUNDLE_SHA" --arg vast "$VAST_ID" \
            --argjson test_run "$TESTPYPI_RUN" --argjson test_attempt "$TESTPYPI_ATTEMPT" \
            --argjson run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            '{schema: 1, index: "pypi", commit: $commit, bundle_sha256: $bundle,
              vast_lab_id: $vast, testpypi_run: $test_run, testpypi_attempt: $test_attempt,
              workflow_run: $run, workflow_attempt: $attempt, version, wheel_sha256, bytes}' \
            "$RUNNER_TEMP/index.json" > "$RUNNER_TEMP/pypi-receipt.json"

      - name: Preserve the PyPI receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: standalone-stable-pypi-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pypi-receipt.json
          if-no-files-found: error
          retention-days: 30
