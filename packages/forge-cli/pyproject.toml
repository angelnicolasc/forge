[project]
name = "forge-cli"
version = "0.2.0"
description = "CLI for Forge — wrap any multi-agent flow in one command. Watch it evolve."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Angel DiCerutti", email = "angelnicolascorzo@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
keywords = ["cli", "agents", "orchestration", "forge"]
dependencies = [
    "forge-core==0.2.0",
    "forge-adapters==0.2.0",
    "forge-observe==0.2.0",
    "forge-memory==0.2.0",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.0,<26.0",
]

[project.optional-dependencies]
rules = ["forge-rules==0.2.0"]
mcp = ["forge-mcp==0.2.0"]
skills = ["forge-skills==0.2.0"]
spec = ["forge-spec==0.2.0"]
review = ["forge-review==0.2.0"]

[project.scripts]
forge = "forge_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_cli"]
