[project]
name = "forge-spec"
version = "0.2.0"
description = "Spec-Driven Development for Forge — structured acceptance criteria, SLSA Level 2 attestation, and spec-gated evolution."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Angel DiCerutti", email = "angelnicolascorzo@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
keywords = ["agents", "llm", "spec", "slsa", "acceptance", "attestation", "compliance"]
dependencies = [
    "forge-core==0.2.0",
    "pydantic>=2.7,<3.0",
    "structlog>=24.0,<26.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_spec"]
