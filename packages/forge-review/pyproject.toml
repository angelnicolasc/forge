[project]
name = "forge-review"
version = "0.1.0"
description = "Review Agents and Policy Gates for Forge — parallel reviewers, cascading heuristics, severity-based blocking."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Angel DiCerutti", email = "angelnicolascorzo@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
keywords = ["agents", "llm", "review", "policy", "gates", "quality", "forge"]
dependencies = [
    "forge-core==0.1.0",
    "pydantic>=2.7,<3.0",
    "structlog>=24.0,<26.0",
    "anyio>=4.0",
]

[project.optional-dependencies]
spec = [
    "forge-spec==0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_review"]
