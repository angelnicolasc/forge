[project]
name = "forge-observe"
version = "0.1.0"
description = "Production observability and FinOps for Forge — OpenTelemetry tracing, cost tracking, and real-time metrics."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Angel DiCerutti", email = "angelnicolascorzo@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
keywords = ["observability", "opentelemetry", "finops", "cost-tracking", "agents"]
dependencies = [
    "forge-core==0.1.0",
    "pydantic>=2.7,<3.0",
    "structlog>=24.0,<26.0",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25,<2.0",
    "opentelemetry-exporter-otlp>=1.25",
    "rich>=13.7",
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_observe"]
