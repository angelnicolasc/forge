[project]
name = "forge-adapters"
version = "0.2.0"
description = "Framework adapters for Forge — drop-in wrappers for LangGraph, CrewAI, AutoGen, and any async callable."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Angel DiCerutti", email = "angelnicolascorzo@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
keywords = ["agents", "langgraph", "crewai", "autogen", "adapters"]
dependencies = [
    "forge-core==0.2.0",
    "pydantic>=2.7,<3.0",
    "structlog>=24.0,<26.0",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2"]
crewai = ["crewai>=0.80"]
autogen = ["autogen-agentchat>=0.4"]
all = ["langgraph>=0.2", "crewai>=0.80", "autogen-agentchat>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_adapters"]
