[project]
name = "forge-os"
version = "0.1.0"
description = "Forge — universal agent harness (meta-package). Installs forge-core, forge-cli, forge-observe, forge-memory, and forge-adapters together."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Angel DiCerutti", email = "angelnicolascorzo@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
keywords = ["agents", "llm", "orchestration", "harness", "multi-agent", "self-evolving", "forge"]
dependencies = [
    "forge-core==0.1.0",
    "forge-cli==0.1.0",
    "forge-observe==0.1.0",
    "forge-memory==0.1.0",
    "forge-adapters==0.1.0",
]

[project.optional-dependencies]
langgraph = ["forge-adapters[langgraph]==0.1.0"]
crewai = ["forge-adapters[crewai]==0.1.0"]
autogen = ["forge-adapters[autogen]==0.1.0"]
all = ["forge-adapters[all]==0.1.0"]

[project.urls]
Homepage = "https://github.com/angelnicolasc/forge"
Repository = "https://github.com/angelnicolasc/forge"
Issues = "https://github.com/angelnicolasc/forge/issues"
Changelog = "https://github.com/angelnicolasc/forge/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_os"]
