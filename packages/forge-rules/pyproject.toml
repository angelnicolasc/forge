[project]
name = "forge-rules"
version = "0.2.0"
description = "Rules Engine for Forge — context-aware rule packs with conflict resolution and scope intersection detection."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Angel DiCerutti", email = "angelnicolascorzo@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
keywords = ["rules-engine", "context-engineering", "agents", "governance", "forge"]
dependencies = [
    "forge-core==0.2.0",
    "pydantic>=2.7,<3.0",
    "structlog>=24.0,<26.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
intent = ["forge-core[intent]"]
opa = ["requests>=2.32"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_rules"]
