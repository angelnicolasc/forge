[project]
name = "forge-mcp"
version = "0.2.0"
description = "MCP Meta-Orchestrator for Forge — routes, secures, budgets, and caches tool calls across N upstream MCP servers."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Angel DiCerutti", email = "angelnicolascorzo@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
keywords = ["mcp", "model-context-protocol", "tools", "agents", "routing", "forge"]
dependencies = [
    "forge-core==0.2.0",
    "pydantic>=2.7,<3.0",
    "structlog>=24.0,<26.0",
    "pyyaml>=6.0",
    "anyio>=4.0",
]

[project.optional-dependencies]
# Official Anthropic MCP Python SDK — required for real stdio/SSE upstream connections.
# Core routing/security/budget/cache logic works without it (tests use fakes).
sdk = ["mcp>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_mcp"]
