[project]
name = "forge-memory"
version = "0.1.0"
description = "Living Collaborative Memory for Forge — hybrid vector + graph + symbolic knowledge base with versioning and provenance."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Angel DiCerutti", email = "angelnicolascorzo@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
keywords = ["memory", "knowledge-base", "vector-db", "graph-db", "agents"]
dependencies = [
    "forge-core==0.1.0",
    "pydantic>=2.7,<3.0",
    "structlog>=24.0,<26.0",
    "chromadb>=0.5",
    "networkx>=3.3",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.20"]
qdrant = ["qdrant-client>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_memory"]
